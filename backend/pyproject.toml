[project]
name = "backend"
version = "0.1.0"
description = "OpeningGuard AI synthetic order-capacity simulator and risk agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "numpy>=2.0",
    "openai>=2.0",
]

[project.scripts]
openingguard = "openingguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openingguard"]
